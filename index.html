<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b17">
<title>Mi Hucha — Ahorro personal</title>
<style>
:root{--bg:#101814;--panel:#19241e;--panel2:#202e26;--green:#b8f36b;--muted:#9ba99f;--text:#f3f7f2;--line:#304036;--red:#ff8a82}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d3024 0,#101814 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:24px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:var(--green);display:grid;place-items:center;font-size:26px}.brand h1{font-size:21px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.pill{border:1px solid var(--line);background:#17221b;color:var(--green);padding:8px 12px;border-radius:30px;font-size:12px;font-weight:700}
.hero{background:linear-gradient(135deg,#263a2c,#19251e 70%);border:1px solid #3a5140;border-radius:28px;padding:25px;position:relative;overflow:hidden;margin-bottom:16px}.hero:after{content:"🐷";position:absolute;right:16px;bottom:4px;font-size:100px;opacity:.13;transform:rotate(-12deg)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:700}.total{font-size:clamp(38px,9vw,58px);font-weight:800;letter-spacing:-2px;margin:8px 0 4px;color:var(--green);line-height:1.1}.hero small{color:var(--muted)}
.goal{margin-top:24px;position:relative;z-index:1}.goal-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:9px}.goal-head span:last-child{color:var(--green);font-weight:700}.track{height:10px;background:#0f1712;border-radius:20px;overflow:hidden;border:1px solid #344638}.bar{height:100%;width:0;background:linear-gradient(90deg,#8cd84b,#d0ff8c);border-radius:20px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:20px;font-weight:750;margin-top:6px;overflow-wrap:anywhere}
.content{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1.2fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}.card h2{font-size:17px;margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:7px}.field input{width:100%;background:#101814;color:var(--text);border:1px solid #3a4b3e;border-radius:12px;padding:13px;font:inherit;outline:none}.field input:focus{border-color:var(--green)}.money-input{font-size:24px!important;font-weight:750}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:var(--green);color:#152014;font-weight:800;font-size:15px;cursor:pointer}.btn:active{transform:scale(.99)}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:10px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.list-head h2{margin:0}.history{display:flex;flex-direction:column;gap:9px}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#121b15;border:1px solid #29372d;border-radius:14px;padding:12px}.entry-left{display:flex;align-items:center;gap:11px;min-width:0}.coin{width:38px;height:38px;border-radius:12px;background:#2b3b2c;display:grid;place-items:center;font-size:18px;flex-shrink:0}.entry-desc{font-weight:700;font-size:14px;overflow-wrap:anywhere}.entry-date{font-size:11px;color:var(--muted);margin-top:3px}.entry-right{text-align:right;flex-shrink:0}.entry-amount{font-weight:800;color:var(--green)}.actions{display:flex;gap:5px;justify-content:flex-end;margin-top:5px}.tiny{border:1px solid var(--line);background:#1d2a21;color:var(--muted);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer}.tiny.delete{color:var(--red)}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.empty .big{font-size:40px;margin-bottom:10px}.foot{text-align:center;color:#718076;font-size:11px;margin-top:18px}
@media(max-width:650px){.wrap{padding:18px 13px 28px}.content{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat .value{font-size:17px}.hero{padding:22px}.top{margin-bottom:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="logo">🐷</div><div><h1>Mi Hucha</h1><p>Tu ahorro, paso a paso</p></div></div>
  <div class="pill">💚 AHORRO PERSONAL</div>
</header>
<section class="hero">
  <div class="eyebrow">Dinero acumulado</div>
  <div class="total" id="total">0,00 €</div>
  <small id="subtitle">Cada pequeño ahorro cuenta.</small>
  <div class="goal">
    <div class="goal-head"><span>🎯 Objetivo de ahorro</span><span id="goalLabel">0% · 0,00 €</span></div>
    <div class="track"><div class="bar" id="progress"></div></div>
  </div>
</section>
<section class="stats">
  <div class="stat"><div class="label">Este mes</div><div class="value" id="monthTotal">0,00 €</div></div>
  <div class="stat"><div class="label">Este año</div><div class="value" id="yearTotal">0,00 €</div></div>
  <div class="stat"><div class="label">Ingresos registrados</div><div class="value" id="count">0</div></div>
</section>
<div class="content">
  <section class="card">
    <h2>➕ Añadir ahorro</h2>
    <form id="entryForm">
      <div class="field"><label for="amount">Cantidad (€)</label><input id="amount" class="money-input" type="number" min="0.01" step="0.01" placeholder="Ej. 20,00" required></div>
      <div class="field"><label for="date">Fecha</label><input id="date" type="date" required></div>
      <div class="field"><label for="note">Nota (opcional)</label><input id="note" type="text" maxlength="80" placeholder="Ej. Ahorro semanal"></div>
      <button class="btn" id="submitBtn" type="submit">Guardar ingreso</button>
    </form>
    <div style="margin-top:12px"><button class="btn secondary" id="goalBtn" type="button">🎯 Configurar objetivo</button></div>
  </section>
  <section class="card">
    <div class="list-head"><h2>📒 Historial</h2><button class="btn secondary" id="exportBtn" type="button">Exportar CSV</button></div>
    <div id="history" class="history"></div>
  </section>
</div>
<div class="foot">Los datos se guardan en este navegador y dispositivo.</div>
</div>
<script>
const KEY='miHuchaEntries_v1', GOALKEY='miHuchaGoal_v1';
let entries=[], editing=null, goal=Number(localStorage.getItem(GOALKEY)||1000);
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{entries=[]} $('date').value=today();render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
function render(){
 const total=entries.reduce((s,e)=>s+Number(e.amount),0), now=today(), month=now.slice(0,7), year=now.slice(0,4);
 $('total').textContent=fmt(total);$('monthTotal').textContent=fmt(entries.filter(e=>e.date.startsWith(month)).reduce((s,e)=>s+Number(e.amount),0));
 $('yearTotal').textContent=fmt(entries.filter(e=>e.date.startsWith(year)).reduce((s,e)=>s+Number(e.amount),0));$('count').textContent=entries.length;
 const pct=goal>0?Math.min(100,total/goal*100):0;$('progress').style.width=pct+'%';$('goalLabel').textContent=Math.round(pct)+'% · '+fmt(goal);
 $('subtitle').textContent=goal>total?`Te faltan ${fmt(goal-total)} para tu objetivo.`:'¡Objetivo alcanzado! ¡Enhorabuena! 🎉';
 const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.created-b.created);
 if(!sorted.length){$('history').innerHTML='<div class="empty"><div class="big">🪙</div><b>Tu hucha está esperando</b><div style="font-size:13px;margin-top:5px">Añade tu primer ahorro para empezar.</div></div>';return}
 $('history').innerHTML=sorted.map(e=>`<div class="entry"><div class="entry-left"><div class="coin">🪙</div><div><div class="entry-desc">${esc(e.note||'Ingreso en la hucha')}</div><div class="entry-date">${dateEs(e.date)}</div></div></div><div class="entry-right"><div class="entry-amount">+${fmt(Number(e.amount))}</div><div class="actions"><button class="tiny" onclick="editEntry('${e.id}')">Editar</button><button class="tiny delete" onclick="deleteEntry('${e.id}')">Borrar</button></div></div></div>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateEs(s){if(!s)return '';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value),date=$('date').value,note=$('note').value.trim();if(!Number.isFinite(amount)||amount<=0||!date){alert('Introduce una cantidad válida y una fecha.');return}
 if(editing){let x=entries.find(x=>x.id===editing);if(x){x.amount=amount;x.date=date;x.note=note}editing=null;$('submitBtn').textContent='Guardar ingreso'}
 else entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),amount,date,note,created:Date.now()});
 persist();$('entryForm').reset();$('date').value=today();render()});
window.editEntry=id=>{let e=entries.find(x=>x.id===id);if(!e)return;editing=id;$('amount').value=e.amount;$('date').value=e.date;$('note').value=e.note;$('submitBtn').textContent='Guardar cambios';$('amount').focus()};
window.deleteEntry=id=>{if(!confirm('¿Quieres borrar este ingreso?'))return;entries=entries.filter(e=>e.id!==id);if(editing===id){editing=null;$('entryForm').reset();$('date').value=today();$('submitBtn').textContent='Guardar ingreso'}persist();render()};
$('goalBtn').addEventListener('click',()=>{let val=prompt('¿Cuál es tu objetivo de ahorro en euros?',goal);if(val===null)return;val=Number(val);if(!Number.isFinite(val)||val<=0){alert('Introduce un objetivo mayor que cero.');return}goal=val;localStorage.setItem(GOALKEY,String(goal));render()});
$('exportBtn').addEventListener('click',()=>{if(!entries.length){alert('Todavía no hay ingresos que exportar.');return}const rows=[['Fecha','Cantidad (€)','Nota'],...entries.map(e=>[e.date,Number(e.amount).toFixed(2),e.note])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mi-hucha-historial.csv';a.click();URL.revokeObjectURL(url)});
load();
</script>
</body>
</html>
