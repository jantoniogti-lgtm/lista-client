# PLX MAX IPTV — Soporte listas M3U con grupos

<body>

<header>PLX MAX IPTV</header>

<div class="player">
<video id="video" controls autoplay playsinline></video>
</div>

<div class="controls">
<input type="text" id="m3uUrl" placeholder="Pega aquí la URL de tu lista M3U">
<button onclick="loadM3U()">CARGAR LISTA</button>
</div>

<div id="content"></div>

<footer>
PLX MAX IPTV WEB APP
</footer>

<script>

const video = document.getElementById('video');
let hls;

function loadChannel(url){

if(hls){
hls.destroy();
}

if(Hls.isSupported()){

hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);

}else{

video.src = url;

}

}

async function loadM3U(){

const url = document.getElementById('m3uUrl').value;

if(!url){
alert('Introduce una URL M3U');
return;
}

try{

const response = await fetch(url);
const text = await response.text();

parseM3U(text);

}catch(e){
alert('Error cargando la lista');
console.error(e);
}

}

function parseM3U(data){

const lines = data.split('\n');
const groups = {};

let currentInfo = null;

for(let i=0;i<lines.length;i++){

const line = lines[i].trim();

if(line.startsWith('#EXTINF')){

const nameMatch = line.split(',');
const channelName = nameMatch[nameMatch.length-1];

const groupMatch = line.match(/group-title="(.*?)"/);
const logoMatch = line.match(/tvg-logo="(.*?)"/);

currentInfo = {
name: channelName,
group: groupMatch ? groupMatch[1] : 'OTROS',
logo: logoMatch ? logoMatch[1] : ''
};

}else if(line.startsWith('http')){

if(currentInfo){

if(!groups[currentInfo.group]){
groups[currentInfo.group] = [];
}

groups[currentInfo.group].push({
name: currentInfo.name,
logo: currentInfo.logo,
url: line
});

currentInfo = null;

}

}

}

renderGroups(groups);

}

function renderGroups(groups){

const content = document.getElementById('content');
content.innerHTML = '';

Object.keys(groups).forEach(groupName => {

const section = document.createElement('div');
section.className = 'section';

const title = document.createElement('h2');
title.innerText = groupName;
section.appendChild(title);

const channels = document.createElement('div');
channels.className = 'channels';

groups[groupName].forEach(channel => {

const card = document.createElement('div');
card.className = 'card';
card.onclick = () => loadChannel(channel.url);

card.innerHTML = `
<div class="live">LIVE</div>
${channel.logo ? `<img src="${channel.logo}" class="logo">` : ''}
<h3>${channel.name}</h3>
`;

channels.appendChild(card);

});

section.appendChild(channels);
content.appendChild(section);

});

}

</script>

</body>
</html>
