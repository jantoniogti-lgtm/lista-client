
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Reto</title>
<style>
body{margin:0;background:#0f0b1a;color:#fff;font-family:Arial}
header{background:#7c3aed;padding:18px;text-align:center}
.wrap{max-width:900px;margin:auto;padding:15px}
.card,.bet{background:#1b1028;border-radius:12px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.val{font-size:28px;font-weight:bold;color:#f43f5e}
.bet{border-left:5px solid #a855f7}
.row{display:flex;justify-content:space-between;margin:5px 0}
input,select,button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px}
button{background:#7c3aed;color:#fff;cursor:pointer}

.progress{height:18px;background:#2b3645;border-radius:20px;overflow:hidden;margin:15px 0}
.progressFill{height:100%;background:#f43f5e;width:0%;transition:.3s}
.center{text-align:center}
.bigbank{font-size:42px;font-weight:bold;color:#f43f5e}


.positive{color:#22c55e!important;font-weight:bold}
.negative{color:#ef4444!important;font-weight:bold}
.pending{color:#facc15!important;font-weight:bold}

</style></head><body>
<header><h1>🏆 SUPER RETO</h1><div>Reto 27€ ➜ 500€</div></header>
<div class="wrap">
<div class="card">
<div class="center"><div>💰 BANK ACTUAL</div><div id="bank" class="bigbank"></div></div>
<div class="progress"><div class="progressFill" id="progressFill"></div></div>
<div class="center" id="progressTxt"></div>
<div class="grid">
<div><small>Bank</small><div class="val" id="bankMini"></div></div>
<div><small>Beneficio</small><div class="val positive" id="benef"></div></div>
<div><small>Apostado</small><div class="val" id="stakeTot"></div></div>
<div><small>Retornos</small><div class="val positive" id="retTot"></div></div>
</div></div>

<div class="card">
<h3>⚙️ Configuración</h3>
<div class="row"><span>Bank inicial</span><input id="cfgStart" type="number" step="0.01"></div>
<div class="row"><span>Objetivo</span><input id="cfgTarget" type="number" step="0.01"></div>
<button onclick="saveConfig()">Guardar configuración</button>
<button style="background:#dc2626" onclick="resetChallenge()">🔄 Reiniciar reto</button>
</div>
<div class="card">
<h3>Nueva apuesta</h3><div class="pending">💰 Bank disponible: <b id="bankDisponible"></b></div>
<input id="match" placeholder="Partido">
<input id="stake" type="number" step="0.01" placeholder="Importe apostado">
<input id="odds" type="number" step="0.01" placeholder="Cuota">
<select id="status"><option>Pendiente</option><option>Ganada</option><option>Perdida</option></select>
<button onclick="addBet()">Añadir apuesta</button>
</div>
<div id="list"></div>
</div>
<script>
let settings=JSON.parse(localStorage.getItem('superreto_cfg')||'{"start":27,"target":500}');
let start=settings.start;
let target=settings.target;
let bets=JSON.parse(localStorage.getItem("reto27v2")||"null")||[
{match:"🇧🇪 Bélgica vs Senegal",stake:27,odds:4.20,status:"Ganada"},
{match:"🇪🇸 España vs Austria",stake:100,odds:2.00,status:"Ganada"},
{match:"🇵🇹 Portugal vs Croacia",stake:50,odds:2.20,status:"Ganada"},
{match:"🎾 Combinada Bencic + Fonseca",stake:73,odds:2.33,status:"Pendiente"}
];
function save(){localStorage.setItem("reto27v2",JSON.stringify(bets));}

function saveConfig(){
 settings.start=Number(cfgStart.value)||27;
 settings.target=Number(cfgTarget.value)||500;
 localStorage.setItem('superreto_cfg',JSON.stringify(settings));
 start=settings.start;target=settings.target;
 render();
}
function resetChallenge(){
 if(!confirm('¿Seguro que quieres reiniciar el reto?')) return;
 bets=[];
 localStorage.removeItem('reto27v2');
 render();
}


function render(){
 let bank=start,st=0,ret=0,w=0,p=0,l=0;
 list.innerHTML="";
 cfgStart.value=start;
 cfgTarget.value=target;

 bets.forEach((b,i)=>{
   const gross=b.stake*b.odds;
   const profit=gross-b.stake;
   const before=bank;

   // Al crear la apuesta el dinero sale del bank
   bank-=b.stake;

   let after=bank;

   if(b.status==="Ganada"){
      bank+=gross;
      after=bank;
      ret+=gross;
      w++;
   }else if(b.status==="Perdida"){
      l++;
   }else{
      p++;
   }

   st+=b.stake;

   list.innerHTML+=`
   <div class="bet">
   <h3>${b.match}</h3>
   <div class="row"><span>Importe apostado</span><b>${b.stake.toFixed(2)} €</b></div>
   <div class="row"><span>Cuota</span><b>${b.odds.toFixed(2)}</b></div>
   <div class="row"><span>Retorno bruto</span><b>${gross.toFixed(2)} €</b></div>
   <div class="row"><span>Beneficio</span><b class="${profit>=0?'positive':'negative'}">${profit>=0?'+':''}${profit.toFixed(2)} €</b></div>
   <div class="row"><span>Bank antes</span><b>${before.toFixed(2)} €</b></div>
   <div class="row"><span>Bank después</span><b>${after.toFixed(2)} €</b></div>
   <div class="row"><span>Estado</span>
   <select onchange="bets[${i}].status=this.value;render()">
   <option ${b.status==='Pendiente'?'selected':''}>Pendiente</option>
   <option ${b.status==='Ganada'?'selected':''}>Ganada</option>
   <option ${b.status==='Perdida'?'selected':''}>Perdida</option>
   </select></div>
   <button onclick="if(confirm('¿Eliminar apuesta?')){bets.splice(${i},1);render();}">Eliminar</button>
   </div>`;
 });

 bankDisponible.textContent=bank.toFixed(2)+" €";
 document.getElementById("bank").textContent=bank.toFixed(2)+" €";
 document.getElementById("bankMini").textContent=bank.toFixed(2)+" €";
 benef.textContent=(bank-start).toFixed(2)+" €";
 stakeTot.textContent=st.toFixed(2)+" €";
 retTot.textContent=ret.toFixed(2)+" €";
 const prog=Math.min((bank/target)*100,100);
 progressFill.style.width=prog+"%";
 progressTxt.innerHTML=`<span class="positive">${prog.toFixed(1)}% del reto</span> | <span class="positive">🟢 ${w}</span> <span class="pending">🟡 ${p}</span> <span class="negative">🔴 ${l}</span>`;
 save();
}

function addBet(){
bets.push({match:match.value,stake:+stake.value,odds:+odds.value,status:status.value});
match.value="";stake.value="";odds.value="";status.value="Pendiente";render();
}
render();
</script>
</body></html>
